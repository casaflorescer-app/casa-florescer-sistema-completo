name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      static_ok: ${{ steps.static_build.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      # Produção operacional é Vercel (SSR). O export estático do Pages falha com
      # rotas force-dynamic — não deve falhar o check nem bloquear o pipeline.
      - name: Build static export (Pages preview; best-effort)
        id: static_build
        continue-on-error: true
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /casa-florescer-sistema-completo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Surface Next.js warning
        if: steps.static_build.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages static export failed (non-blocking)::$(tail -c 1800 build.log | tr '\n' ' | ')"
          echo '## Next.js static export log (non-blocking)' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.static_build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.static_ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
